<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E6A55">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="旅のしおり">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>マレーシア旅のしおり</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@700&family=Shippori+Mincho+B1:wght@800&display=swap">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<style>
/* レイアウト：スマホは上に見出し・下にタブバー、PCは左にメニュー・中央に1カラム */
:root{
  --bg:#F2F5F1; --surface:#FFFFFF; --surface2:#E9EFEA; --ink:#15201B; --muted:#5B6A63; --line:#D7E0DA;
  --accent:#0E6A55; --accent-ink:#FFFFFF; --accent-soft:#DCEDE6; --hi:#D9940F; --hi-soft:#FBEFD2;
  --danger:#BC3B26; --pos:#0E7A4D; --neg:#BC3B26;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-head:"Zen Maru Gothic","Zen Kaku Gothic New","Hiragino Maru Gothic ProN",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:14px; --r-sm:10px; --tabbar:64px;
  --shadow:0 1px 2px rgb(20 40 30 / .06),0 6px 20px rgb(20 40 30 / .06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#17201C; --surface2:#1F2925; --ink:#E5EDE9; --muted:#97A7A0; --line:#2A3631;
  --accent:#4DBE9C; --accent-ink:#06231B; --accent-soft:#183A31; --hi:#F0B53A; --hi-soft:#3A2F14;
  --danger:#F07A63; --pos:#5CCB95; --neg:#F07A63; --shadow:0 1px 2px rgb(0 0 0 / .3); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#17201C; --surface2:#1F2925; --ink:#E5EDE9; --muted:#97A7A0; --line:#2A3631;
  --accent:#4DBE9C; --accent-ink:#06231B; --accent-soft:#183A31; --hi:#F0B53A; --hi-soft:#3A2F14;
  --danger:#F07A63; --pos:#5CCB95; --neg:#F07A63; --shadow:0 1px 2px rgb(0 0 0 / .3); color-scheme:dark;}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.65;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--f-head);line-height:1.3;text-wrap:balance;margin:0}
p{margin:.4em 0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)} .small{font-size:.85rem} .big{font-size:1.35rem}
.sel{user-select:text;-webkit-user-select:text}
.row{display:flex;align-items:center;flex-wrap:wrap}
.row.gap{gap:10px} .row.between{justify-content:space-between;gap:8px} .row.end{justify-content:flex-end}
.ic{display:inline-flex;width:20px;height:20px;flex:none}
.ic svg{width:100%;height:100%}
.ic.lg{width:24px;height:24px;color:var(--accent)} .ic.xl{width:40px;height:40px;color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------- 骨組み ---------- */
.app{min-height:100%}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;max-width:820px;margin:0 auto}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand small{color:var(--muted);font-size:.75rem;white-space:nowrap}
#view-title{font-size:1.15rem}
.sync{font-size:.72rem;padding:3px 9px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.sync.cloud{background:var(--accent-soft);color:var(--accent)}
main{padding:14px 16px calc(var(--tabbar) + 28px + env(safe-area-inset-bottom,0px));max-width:820px;margin:0 auto}
#sidenav{display:none}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:var(--tabbar);border:0;background:none;color:var(--muted);font-size:.68rem;min-width:0}
.tab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tab .ic{width:23px;height:23px}
.tab.on{color:var(--accent);font-weight:700}
@media (min-width:900px){
  .tabbar{display:none}
  .shell{display:grid;grid-template-columns:230px minmax(0,1fr);max-width:1180px;margin:0 auto}
  #sidenav{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;padding:18px 12px;border-right:1px solid var(--line)}
  .side-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:0;border-radius:10px;background:none;text-align:left;color:var(--muted)}
  .side-item:hover{background:var(--surface2)}
  .side-item.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
  main{padding-bottom:40px}
  .side-brand{font-family:var(--f-head);font-size:1.05rem;padding:4px 12px 14px}
}

/* ---------- 部品 ---------- */
.block{margin-top:22px}
.sec{font-size:1.02rem;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sec.small{font-size:.86rem;color:var(--muted);letter-spacing:.04em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);min-width:0}
.cards2{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:640px){.cards2{grid-template-columns:1fr 1fr}}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;padding:3px 10px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill .ic{width:14px;height:14px}
.pill.accent{background:var(--accent);color:var(--accent-ink);font-weight:700}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--hi-soft);color:var(--hi)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 6px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-size:.85rem;text-decoration:none;color:var(--ink);min-height:38px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.chip.ghost{border-style:dashed;color:var(--muted)}
.chip .ic{width:16px;height:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;min-height:44px;text-decoration:none;color:var(--ink);font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.danger.ghost{background:none;color:var(--danger)}
.btn.small{min-height:36px;padding:6px 12px;font-size:.85rem}
.btn.wide{width:100%;margin-top:14px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border:0;border-radius:10px;background:none;color:var(--muted)}
.icon-btn:hover{background:var(--surface2)}
.linkbtn{display:inline-flex;align-items:center;gap:3px;border:0;background:none;color:var(--accent);font-size:.8rem;padding:2px 0;font-weight:700}
.linkbtn .ic{width:14px;height:14px}
.note{display:flex;gap:8px;align-items:flex-start;background:var(--hi-soft);border-radius:var(--r-sm);padding:10px 12px;font-size:.85rem;margin-top:12px}
.note .ic{color:var(--hi);margin-top:2px}
.empty{color:var(--muted);text-align:center;padding:24px 8px}
.empty-state{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:28px 12px;border:1px dashed var(--line);border-radius:var(--r);margin-top:12px}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:.7rem;padding:1px 8px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.tag.t-cn{background:var(--accent-soft);color:var(--accent)}
.tag.t-herb,.tag.t-hot{background:var(--hi-soft);color:var(--hi)}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:10px 0}
.kv dt{color:var(--muted);white-space:nowrap} .kv dd{margin:0;min-width:0}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:4px;gap:4px}
.seg-btn{flex:1;border:0;background:none;border-radius:9px;padding:9px 6px;font-size:.88rem;color:var(--muted);min-height:40px}
.seg-btn.on{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
.seg.small .seg-btn{padding:6px;min-height:36px}
.input,.select{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;min-height:46px;font-size:16px}
.input.big{font-size:1.6rem;padding:8px 12px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.fld>span{font-size:.8rem;color:var(--muted);font-weight:500}
.form{display:flex;flex-direction:column;gap:14px}
.err{color:var(--danger);font-size:.85rem;margin:0}
.table-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th,.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{color:var(--muted);font-weight:500;font-size:.78rem}
.pos{color:var(--pos)} .neg{color:var(--neg)}

/* ---------- シート・トースト ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-backdrop{position:absolute;inset:0;background:rgb(0 0 0 / .35);opacity:0;transition:opacity .2s}
.sheet{position:relative;width:100%;max-width:640px;max-height:88vh;background:var(--surface);border-radius:20px 20px 0 0;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .22s ease;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-wrap.open .sheet{transform:none} .sheet-wrap.open .sheet-backdrop{opacity:1}
@media (min-width:900px){.sheet-wrap{align-items:center}.sheet{border-radius:20px}}
.sheet-grip{width:40px;height:4px;border-radius:4px;background:var(--line);margin:8px auto 0}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:8px 10px 6px 18px}
.sheet-head h2{font-size:1.1rem}
.sheet-body{overflow-y:auto;padding:4px 18px 22px;overscroll-behavior:contain}
.sheet-body h3{font-size:.95rem;margin:16px 0 6px}
#toast{position:fixed;left:50%;bottom:calc(var(--tabbar) + 84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);opacity:0;transition:.2s;z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.88rem;max-width:calc(100% - 32px)}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* ---------- 日程 ---------- */
.hero{padding:6px 0 4px}
.hero-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.85rem}
.hero h1{font-size:1.7rem;margin:8px 0 10px}
.route{display:flex;flex-wrap:wrap;gap:4px 0;list-style:none;padding:0;margin:0;font-size:.85rem}
.route li{display:flex;align-items:center}
.route li:not(:last-child)::after{content:"";width:18px;height:1px;background:var(--muted);margin:0 6px}
.flight-line{display:flex;align-items:center;gap:8px;margin:8px 0 4px;font-size:.95rem}
.flight-line .ic{color:var(--accent);width:18px;height:18px}
.daystrip{position:relative;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 10px}
.daystrip::-webkit-scrollbar{display:none}
.daypill{flex:none;display:flex;flex-direction:column;align-items:center;width:62px;padding:8px 0;border:1px solid var(--line);border-radius:14px;background:var(--surface);line-height:1.25}
.daypill strong{font-family:var(--f-mono);font-size:1.05rem}
.daypill small{font-size:.68rem;color:var(--muted)}
.daypill.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.daypill.on small{color:inherit;opacity:.85}
.daypill.today{box-shadow:inset 0 0 0 2px var(--hi)}
.day-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin:6px 0 10px}
.day-head h2{font-size:1.25rem}
.timeline{list-style:none;margin:0;padding:0}
.tl{display:grid;grid-template-columns:48px 28px minmax(0,1fr);gap:0 8px;position:relative;padding-bottom:14px}
.tl::before{content:"";position:absolute;left:69px;top:28px;bottom:0;width:2px;background:var(--line)}
.tl:last-child::before{display:none}
.tl-time{font-size:.85rem;color:var(--muted);padding-top:4px;text-align:right}
.tl-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--surface2);color:var(--muted)}
.tl-dot .ic{width:16px;height:16px}
.tl.see .tl-dot{background:var(--accent-soft);color:var(--accent)}
.tl.eat .tl-dot{background:var(--hi-soft);color:var(--hi)}
.tl.fly .tl-dot{background:var(--accent);color:var(--accent-ink)}
.tl-text{padding-top:3px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0}

/* ---------- スポット ---------- */
.card.spot{text-align:left;display:flex;flex-direction:column;gap:6px;width:100%}
.card.spot .ic{color:var(--muted);width:16px;height:16px}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted);margin:0}
.tag.food{background:var(--surface2)}
.tips,.foods{padding-left:1.1em;margin:0}
.foods{list-style:none;padding:0;display:flex;flex-direction:column;gap:8px}
.foods li{border-bottom:1px solid var(--line);padding-bottom:8px}
.foods small{color:var(--muted)}
.detail .chips{margin-top:14px}

/* ---------- 交通 ---------- */
.odpick{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:end;gap:8px;margin:14px 0 10px}
.swap{margin-bottom:3px;background:var(--surface2)}
.trains{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:8px}
.train{width:100%;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.train.mine{border-color:var(--hi);box-shadow:inset 4px 0 0 var(--hi)}
.t-time{font-size:1.25rem;display:flex;gap:8px;align-items:baseline}
.t-time i{font-style:normal;color:var(--muted);font-size:.9rem}
.t-meta{display:flex;gap:8px;align-items:center}
.badge{font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--surface2)}
.badge.c-EP{background:var(--accent-soft);color:var(--accent)}
.badge.c-EG{background:var(--hi-soft);color:var(--hi)}
.stops{list-style:none;padding:0;margin:0}
.stops li{display:flex;gap:14px;padding:7px 4px;border-bottom:1px solid var(--line)}
.stops li.hit{background:var(--accent-soft);font-weight:700;border-radius:8px}
.card.tr{display:flex;flex-direction:column;gap:6px}
.card.tr .kv{margin:2px 0}

/* ---------- 割り勘 ---------- */
.split-sum{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px;background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:14px;margin-bottom:12px}
.split-sum div{display:flex;flex-direction:column;min-width:0}
.split-sum small{color:inherit;opacity:.8;font-size:.72rem}
.split-sum strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exp-list,.moves,.member-list,.checklist,.guide-list,.sos{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.exp{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.exp.transfer{background:var(--surface2);border-style:dashed}
.exp-main{display:flex;flex-direction:column;min-width:0}
.exp-main small{font-size:.76rem}
.exp-amt{text-align:right;font-size:.95rem}
.card.move{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px 12px}
.move-who{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.move-who .arrow{color:var(--muted)}
.move-amt{display:flex;flex-direction:column;align-items:flex-end}
.card.move .btn{grid-column:1/-1}
@media (min-width:520px){.card.move{grid-template-columns:minmax(0,1fr) auto auto}.card.move .btn{grid-column:auto}}
.member-list li{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 8px 6px 14px;min-height:50px}
.fab{position:fixed;right:16px;bottom:calc(var(--tabbar) + 14px + env(safe-area-inset-bottom,0px));z-index:25;display:flex;align-items:center;gap:6px;border:0;border-radius:99px;padding:14px 20px;background:var(--accent);color:var(--accent-ink);font-weight:700;box-shadow:0 6px 20px rgb(0 0 0 / .2)}
@media (min-width:900px){.fab{bottom:28px;right:max(28px,calc((100vw - 1180px)/2 + 28px))}}

/* ---------- 持ち物・注意 ---------- */
.progress-card{display:flex;flex-direction:column;gap:8px}
.bar{height:10px;border-radius:10px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:10px;transition:width .3s}
.checklist li{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.check{display:flex;align-items:center;gap:12px;padding:12px 14px;flex:1;cursor:pointer;min-height:50px}
.check input{position:absolute;opacity:0;width:1px;height:1px}
.check .box{width:24px;height:24px;border:2px solid var(--line);border-radius:7px;display:flex;align-items:center;justify-content:center;color:transparent;flex:none}
.check .box .ic{width:22px;height:22px}
.check input:checked + .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.check input:focus-visible + .box{outline:2px solid var(--accent);outline-offset:2px}
.check.done span:last-child{color:var(--muted);text-decoration:line-through}
.gitem details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.gitem summary{display:flex;gap:10px;align-items:baseline;cursor:pointer;list-style:none}
.gitem summary::-webkit-details-marker{display:none}
.gitem p{margin:8px 0 2px;font-size:.92rem}
.lv{flex:none;font-size:.7rem;font-weight:700;padding:1px 8px;border-radius:6px;background:var(--surface2);color:var(--muted)}
.gitem.must .lv{background:var(--danger);color:#fff}
.gitem.warn .lv{background:var(--hi-soft);color:var(--hi)}
.sos .card{display:flex;flex-direction:column;gap:2px}
.more-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.more-item{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:var(--surface2);border:0;border-radius:var(--r);padding:14px}
.more-item .ic{color:var(--accent)}
.more-item small{color:var(--muted);font-size:.75rem}

/* ---------- 単体アプリ用 ---------- */
[hidden]{display:none!important}
body{margin:0}
img{max-width:100%}
html,body{height:100%}
:root{padding-top:env(safe-area-inset-top,0px)}
.topbar{top:0}
body.full-view main{padding:0;max-width:none;height:calc(100dvh - 54px - var(--tabbar) - env(safe-area-inset-bottom,0px) - env(safe-area-inset-top,0px));overflow:hidden}

<script>
/* 読み込むファイルの一覧。機能を足すときは、ここに data/ と modules/ のファイルを足す。 */
const FILES = [
  "core/app.js", "core/icons.js", "core/store.js",
  "data/trip.js", "data/spots.js", "data/spot_photos.js", "data/ets.js", "data/transport.js", "data/guide.js", "data/hotels.js", "data/hotel_imgs.js",
  "modules/itinerary.js", "modules/map.js", "modules/spots.js", "modules/transit.js", "modules/split.js",
  "modules/packing.js", "modules/guide.js", "modules/hotels.js",
];
const V = "202610141932";
async function boot(pass) {
  for (const f of FILES) {
    await new Promise((ok) => {
      const s = document.createElement("script");
      s.src = f + "?v=" + V;
      s.onload = ok;
      s.onerror = () => { console.error("読み込み失敗: " + f); ok(); };
      document.body.appendChild(s);
    });
  }
  await App.store_init(pass);
  App.start();
}
(async function () {
  const cfg = window.APP_CONFIG || {};
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  let saved = null;
  try { saved = localStorage.getItem("mt:pass"); } catch (e) {}
  // 全角・半角、ひらがな・カタカナ、空白の違いは同じとみなす
  const norm = (t) => (t || "").normalize("NFKC").replace(/[\u3041-\u3096]/g, (c) => String.fromCharCode(c.charCodeAt(0) + 0x60)).replace(/[\s　]/g, "");
  const hash = async (t) => [...new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)))].map((b) => b.toString(16).padStart(2, "0")).join("");
  if (!cfg.passHash) return boot("");
  if (saved && (await hash(norm(saved))) === cfg.passHash) return boot(norm(saved));
  const gate = document.getElementById("gate");
  gate.hidden = false;
  document.getElementById("gate-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const v = norm(document.getElementById("gate-pass").value);
    if ((await hash(v)) === cfg.passHash) {
      try { localStorage.setItem("mt:pass", v); } catch (x) {}
      gate.hidden = true;
      boot(v);
    } else document.getElementById("gate-err").hidden = false;
  });
})();
</script>
